name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile
        run: python -m compileall -q spark_console tests scripts
      - name: Client unit tests
        run: node --test tests/web/
      - name: JavaScript syntax
        run: for f in web/*.js scripts/ui_smoke.mjs; do node --check "$f" || exit 1; done
      - name: Shell scripts
        run: shellcheck deploy/*.sh
